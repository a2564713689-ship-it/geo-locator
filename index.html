<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06090f">
<title>坐标定位仪 · 高德 GPS 经纬度</title>
<style>
  :root{
    --bg-0:#04060b;
    --bg-1:#0a1220;
    --panel:#0d1622;
    --panel-2:#0a111c;
    --line:rgba(255,255,255,.08);
    --line-2:rgba(255,255,255,.16);
    --txt:#e9eff6;
    --txt-dim:#8fa0b2;
    --txt-faint:#56637a;
    --acc:#34d399;
    --acc-dim:rgba(52,211,153,.14);
    --acc-glow:rgba(52,211,153,.5);
    --warn:#fbbf24;
    --err:#fb7185;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background-color:var(--bg-0);
    background-image:
      radial-gradient(1.2px 1.2px at 18% 22%, rgba(255,255,255,.16), transparent 50%),
      radial-gradient(1px 1px at 72% 10%, rgba(255,255,255,.12), transparent 50%),
      radial-gradient(1.4px 1.4px at 88% 34%, rgba(255,255,255,.10), transparent 50%),
      radial-gradient(1px 1px at 42% 58%, rgba(255,255,255,.08), transparent 50%),
      radial-gradient(1.2px 1.2px at 8% 78%, rgba(255,255,255,.12), transparent 50%),
      radial-gradient(1px 1px at 92% 82%, rgba(255,255,255,.14), transparent 50%),
      radial-gradient(1px 1px at 28% 92%, rgba(255,255,255,.09), transparent 50%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 42%, #03050a 100%);
    color:var(--txt);
    font-family:var(--sans);
    min-height:100%;
    padding:20px 16px calc(26px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:430px;display:flex;flex-direction:column;gap:14px}

  /* ============ header ============ */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    animation:rise .5s ease both;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:42px;height:42px;border-radius:13px;flex:none;
    background:linear-gradient(150deg,#132231,#0a1420);
    border:1px solid var(--line-2);
    display:grid;place-items:center;
    box-shadow:0 6px 18px -6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .logo svg{width:24px;height:24px}
  .title{min-width:0}
  .title h1{font-size:17px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .title p{font-size:11px;color:var(--txt-faint);margin-top:3px;letter-spacing:.08em}
  .status{
    display:flex;align-items:center;gap:7px;flex:none;
    font-size:12px;color:var(--txt-dim);
    border:1px solid var(--line);border-radius:999px;
    padding:7px 12px;background:rgba(255,255,255,.03);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--txt-faint);flex:none;transition:all .3s}
  .status.locating .dot{background:var(--warn);box-shadow:0 0 0 0 rgba(251,191,36,.6);animation:pulse 1.2s ease-out infinite}
  .status.ok .dot{background:var(--acc);box-shadow:0 0 10px var(--acc-glow)}
  .status.err .dot{background:var(--err);box-shadow:0 0 10px rgba(251,113,133,.55)}

  /* ============ coordinate card ============ */
  .coord{
    position:relative;overflow:hidden;
    background:linear-gradient(155deg,#0e1826 0%,#0a111c 70%);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    box-shadow:0 24px 48px -24px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.04);
    animation:rise .5s .06s ease both;
  }
  .coord::before{
    content:"";position:absolute;top:0;left:10%;right:10%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(52,211,153,.55),transparent);
  }
  .coord-deco{
    position:absolute;top:-38px;right:-38px;width:150px;height:150px;
    border-radius:50%;
    border:1px solid rgba(52,211,153,.16);
    box-shadow:0 0 0 12px rgba(52,211,153,.04),0 0 0 30px rgba(52,211,153,.025),0 0 0 52px rgba(52,211,153,.015);
    pointer-events:none;
  }
  .coord-deco::after{
    content:"";position:absolute;top:50%;left:50%;width:8px;height:8px;transform:translate(-50%,-50%);
    background:var(--acc);border-radius:50%;box-shadow:0 0 14px var(--acc-glow);
  }
  .coord-head{
    position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .coord-label{
    display:inline-flex;align-items:center;gap:7px;
    font-size:11px;letter-spacing:.16em;color:var(--txt-dim);
  }
  .coord-label .tick{
    width:14px;height:1px;background:var(--acc);display:inline-block;
    box-shadow:0 0 6px var(--acc-glow);
  }
  .copy{
    display:inline-flex;align-items:center;gap:6px;flex:none;
    font-size:12px;color:var(--acc);font-family:var(--sans);
    background:transparent;border:1px solid rgba(52,211,153,.35);border-radius:9px;
    padding:6px 12px;cursor:pointer;
    transition:background .18s,transform .1s,box-shadow .18s;
  }
  .copy svg{width:13px;height:13px}
  .copy:active{transform:scale(.94)}
  .copy.done{background:var(--acc-dim);border-color:rgba(52,211,153,.55);box-shadow:0 0 14px rgba(52,211,153,.18)}

  .lnglat{display:flex;flex-direction:column;gap:6px;margin-top:16px;position:relative}
  .row{display:flex;align-items:baseline;gap:14px}
  .row .k{
    font-size:11px;color:var(--txt-faint);width:30px;flex:none;
    font-family:var(--mono);letter-spacing:.12em;font-weight:600;
  }
  .row .v{
    font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.15;
    letter-spacing:.015em;font-variant-numeric:tabular-nums;
    color:#ecfdf5;text-shadow:0 0 22px rgba(52,211,153,.22);
    transition:color .3s;
  }
  .row .v.updated{color:var(--acc);text-shadow:0 0 26px var(--acc-glow)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative}
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;color:var(--txt-dim);
    border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;background:rgba(255,255,255,.025);
    font-variant-numeric:tabular-nums;
  }
  .chip b{color:var(--txt);font-weight:600;font-family:var(--mono)}
  .chip.acc{border-color:rgba(52,211,153,.28);background:var(--acc-dim)}
  .chip.acc b{color:var(--acc)}

  /* ============ map ============ */
  .mapbox{
    position:relative;height:42vh;min-height:270px;
    border-radius:20px;overflow:hidden;
    border:1px solid var(--line);
    background:#0a0f16;
    box-shadow:0 24px 48px -24px rgba(0,0,0,.8);
    animation:rise .5s .12s ease both;
  }
  #map{width:100%;height:100%}
  .mapbox.loading::after{
    content:"";position:absolute;inset:0;z-index:2;
    background:radial-gradient(circle at center, transparent 6%, rgba(4,6,11,.82) 72%);
    backdrop-filter:blur(1.5px);
  }
  .radar{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
  .radar .ring{position:absolute;border-radius:50%;border:1px solid rgba(52,211,153,.5)}
  .radar .ring{width:130px;height:130px}
  .radar .ring.r2{width:220px;height:220px;border-color:rgba(52,211,153,.28)}
  .radar .ring.r3{width:312px;height:312px;border-color:rgba(52,211,153,.13)}
  .radar .sweep{
    position:absolute;width:130px;height:130px;border-radius:50%;
    background:conic-gradient(from 0deg, rgba(52,211,153,.35), transparent 22%);
    -webkit-mask-image:radial-gradient(circle, transparent 0 16px, #000 17px);
    mask-image:radial-gradient(circle, transparent 0 16px, #000 17px);
    opacity:.8;
  }
  .radar .core{width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 20px var(--acc-glow),0 0 4px rgba(52,211,153,.8)}
  .radar .cross{position:absolute;background:rgba(52,211,153,.18)}
  .radar .cross.x{width:312px;height:1px}
  .radar .cross.y{width:1px;height:312px}
  .radar .txt{
    position:absolute;bottom:26px;width:100%;text-align:center;
    font-size:12px;color:var(--txt-dim);letter-spacing:.12em;
  }
  .mapbox.loading .ring{animation:rings 1.7s ease-out infinite}
  .mapbox.loading .ring.r2{animation-delay:.32s}
  .mapbox.loading .ring.r3{animation-delay:.64s}
  .mapbox.loading .sweep{animation:spin 1.7s linear infinite}

  .maperr{
    position:absolute;inset:0;z-index:4;display:none;
    place-items:center;text-align:center;padding:24px;
  }
  .maperr.show{display:grid}
  .maperr-inner{animation:rise .4s ease both}
  .maperr .icon{
    width:46px;height:46px;border-radius:50%;border:1px solid rgba(251,191,36,.4);
    display:grid;place-items:center;margin:0 auto 12px;color:var(--warn);
    background:rgba(251,191,36,.06);
  }
  .maperr .icon svg{width:20px;height:20px}
  .maperr h3{font-size:15px;font-weight:600;margin-bottom:7px}
  .maperr p{font-size:12px;color:var(--txt-dim);line-height:1.75}

  /* ============ actions ============ */
  .actions{display:flex;gap:10px;animation:rise .5s .18s ease both}
  .btn{
    flex:1;border:none;border-radius:14px;cursor:pointer;
    font-size:15px;font-weight:600;font-family:var(--sans);
    padding:15px 0;letter-spacing:.08em;
    transition:transform .1s,box-shadow .2s,opacity .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{
    background:linear-gradient(180deg,#4ee6a6,#23c285);
    color:#04150d;
    box-shadow:0 8px 26px rgba(52,211,153,.28), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .btn.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn.ghost{
    flex:none;width:56px;
    background:var(--panel);border:1px solid var(--line-2);color:var(--txt);
    display:grid;place-items:center;
  }
  .btn.ghost svg{width:20px;height:20px}

  /* ============ footer ============ */
  .note{
    text-align:center;font-size:11px;color:var(--txt-faint);line-height:1.9;
    animation:rise .5s .24s ease both;
  }

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(251,191,36,.6)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @keyframes rings{0%{transform:scale(.35);opacity:1}100%{transform:scale(1.12);opacity:0}}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.5">
          <circle cx="12" cy="12" r="8.2"/>
          <path d="M12 3.8V2M12 22v-1.8M2 12h1.8M20.2 12H22" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="2" fill="#34d399" stroke="none"/>
        </svg>
      </span>
      <div class="title">
        <h1>坐标定位仪</h1>
        <p>AMAP · GCJ-02 · 实时定位</p>
      </div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusTxt">待定位</span></div>
  </header>

  <section class="coord">
    <div class="coord-deco"></div>
    <div class="coord-head">
      <span class="coord-label"><span class="tick"></span>当前位置 · CURRENT POSITION</span>
      <button class="copy" id="copyBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>
        </svg>
        <span id="copyTxt">复制</span>
      </button>
    </div>
    <div class="lnglat">
      <div class="row"><span class="k">LNG</span><span class="v" id="lng">--.------</span></div>
      <div class="row"><span class="k">LAT</span><span class="v" id="lat">--.------</span></div>
    </div>
    <div class="chips">
      <span class="chip acc">精度 <b id="acc">--</b></span>
      <span class="chip">来源 <b id="src">--</b></span>
      <span class="chip">更新 <b id="time">--:--:--</b></span>
      <span class="chip">坐标 <b>GCJ-02</b></span>
    </div>
  </section>

  <section class="mapbox loading" id="mapbox">
    <div id="map"></div>
    <div class="radar" id="radar">
      <span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span>
      <span class="sweep"></span>
      <span class="cross x"></span><span class="cross y"></span>
      <span class="core"></span>
      <span class="txt">正在获取卫星信号…</span>
    </div>
    <div class="maperr" id="maperr">
      <div class="maperr-inner">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>
          </svg>
        </div>
        <h3 id="errTitle">定位失败</h3>
        <p id="errMsg"></p>
      </div>
    </div>
  </section>

  <div class="actions">
    <button class="btn primary" id="locateBtn">重新定位</button>
    <button class="btn ghost" id="trackBtn" title="持续追踪">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="note">
    需要 HTTPS 与定位权限，输出 GCJ-02 坐标。<br>
    高德定位失败时自动降级为浏览器原生定位，并显示诊断错误码。
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= 配置区 ================= */
  var CONFIG = {
    key: "d8ea30e0dee999f5cae1ef984d0e0c8b",
    securityJsCode: "ecdb3d40bb86f25a2fb072f4e91a3031"
  };
  /* ========================================== */

  var $ = function(id){ return document.getElementById(id); };
  var statusEl = $("status"), statusTxt = $("statusTxt");
  var lngEl = $("lng"), latEl = $("lat"), accEl = $("acc"), srcEl = $("src"), timeEl = $("time");
  var mapbox = $("mapbox"), radar = $("radar"), maperr = $("maperr");
  var errTitle = $("errTitle"), errMsg = $("errMsg");
  var locateBtn = $("locateBtn"), trackBtn = $("trackBtn");
  var copyBtn = $("copyBtn"), copyTxt = $("copyTxt");

  var map = null, marker = null, accCircle = null, tracking = false, geo = null;

  function setStatus(mode, txt){
    statusEl.className = "status" + (mode ? " " + mode : "");
    statusTxt.textContent = txt;
  }
  function setCoord(lng, lat){
    lngEl.textContent = lng.toFixed(6);
    latEl.textContent = lat.toFixed(6);
    [lngEl, latEl].forEach(function(el){
      el.classList.remove("updated");
      void el.offsetWidth; // 触发重绘以重放动画
      el.classList.add("updated");
    });
  }
  function setTime(){
    var d = new Date();
    var p = function(n){ return (n < 10 ? "0" : "") + n; };
    timeEl.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function srcName(type){
    switch (type) {
      case "html5": return "浏览器定位";
      case "ip": return "IP 定位";
      case "sdk": return "SDK 定位";
      case 1: return "GPS 卫星";
      case 2: return "基站";
      case 4: return "混合定位";
      default: return type || "--";
    }
  }

  function showError(title, msg){
    setStatus("err", "定位失败");
    errTitle.textContent = title || "定位失败";
    errMsg.textContent = msg || "";
    maperr.classList.add("show");
    mapbox.classList.remove("loading");
    locateBtn.disabled = false;
  }

  function drawOnMap(lng, lat, accuracy){
    if(!map) return;
    if(accCircle) map.remove(accCircle);
    if(marker) map.remove(marker);
    marker = new AMap.Marker({ position: [lng, lat] });
    map.add(marker);
    if(accuracy && accuracy > 0){
      accCircle = new AMap.Circle({
        center: [lng, lat], radius: accuracy,
        strokeColor: "#34d399", strokeWeight: 1, strokeOpacity: .6,
        fillColor: "#34d399", fillOpacity: .07
      });
      map.add(accCircle);
      map.setFitView([marker, accCircle], false, [40,40,40,40]);
    } else {
      map.setCenter([lng, lat]);
      map.setZoom(16);
    }
  }

  function onComplete(data){
    radar.style.display = "none";
    mapbox.classList.remove("loading");
    maperr.classList.remove("show");
    locateBtn.disabled = false;
    if(!data || !data.position){
      fallbackToNative("高德定位未返回有效位置");
      return;
    }
    var pos = data.position; // LngLat 对象或 [lng, lat]
    var lng = pos.lng !== undefined ? pos.lng : pos[0];
    var lat = pos.lat !== undefined ? pos.lat : pos[1];
    var acc = data.accuracy;
    setCoord(lng, lat);
    accEl.textContent = acc ? acc + " m" : "--";
    srcEl.textContent = srcName(data.location_type || data.locationType);
    setTime();
    setStatus("ok", "已定位");
    drawOnMap(lng, lat, acc);
  }
  function onError(err){
    var pre = (err && err.message) ? err.message : "";
    fallbackToNative(pre);
  }

  /* ---------- WGS-84 → GCJ-02 坐标转换 ---------- */
  function wgs2gcj(lng, lat){
    var a = 6378245.0, ee = 0.00669342162296594323;
    function outOfChina(l, t){ return l < 72.004 || l > 137.8347 || t < 0.8293 || t > 55.8271; }
    if(outOfChina(lng, lat)) return [lng, lat];
    function transformLat(x, y){
      var r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
      r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3;
      r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI))*2/3;
      r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30))*2/3;
      return r;
    }
    function transformLng(x, y){
      var r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
      r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI))*2/3;
      r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI))*2/3;
      r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI))*2/3;
      return r;
    }
    var dLat = transformLat(lng - 105, lat - 35);
    var dLng = transformLng(lng - 105, lat - 35);
    var radLat = lat / 180 * Math.PI;
    var magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    var sm = Math.sqrt(magic);
    dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sm) * Math.PI);
    dLng = (dLng * 180) / (a / sm * Math.cos(radLat) * Math.PI);
    return [lng + dLng, lat + dLat];
  }

  /* ---------- 原生定位诊断 + 兜底 ---------- */
  function fallbackToNative(reason){
    if(!("geolocation" in navigator)){
      showError("浏览器不支持定位", "当前浏览器不支持定位功能，请更换系统浏览器（Safari / Chrome）后重试。");
      return;
    }
    setStatus("locating", "诊断中");
    maperr.classList.remove("show");
    mapbox.classList.add("loading");
    radar.style.display = "";
    locateBtn.disabled = true;
    navigator.geolocation.getCurrentPosition(
      function(pos){
        radar.style.display = "none";
        mapbox.classList.remove("loading");
        maperr.classList.remove("show");
        locateBtn.disabled = false;
        var c = pos.coords;
        var g = wgs2gcj(c.longitude, c.latitude);
        setCoord(g[0], g[1]);
        accEl.textContent = (c.accuracy != null) ? Math.round(c.accuracy) + " m" : "--";
        srcEl.textContent = "原生定位→GCJ-02";
        setTime();
        setStatus("ok", "已定位");
        drawOnMap(g[0], g[1], c.accuracy);
      },
      function(err){
        radar.style.display = "none";
        mapbox.classList.remove("loading");
        maperr.classList.remove("show");
        locateBtn.disabled = false;
        var code = (err && err.code) ? err.code : 0;
        var title = "定位失败", msg;
        if(code === 1){
          title = "定位权限被拒绝";
          msg = "浏览器错误码 1：请到浏览器「网站设置→位置」里允许本站定位。";
        } else if(code === 2){
          title = "位置不可用";
          msg = "浏览器错误码 2：设备无法获取位置，请确认手机「位置服务」已开启，并移到窗边/户外后重试。";
        } else if(code === 3){
          title = "定位超时";
          msg = "浏览器错误码 3：卫星信号弱，请移到开阔地带后点「重新定位」。";
        } else {
          msg = "未获取到位置" + (reason ? "（" + reason + "）" : "") + "，请重试。";
        }
        showError(title, msg);
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }

  function locate(){
    if(!geo){ locateBtn.disabled = false; return; }
    locateBtn.disabled = true;
    maperr.classList.remove("show");
    mapbox.classList.add("loading");
    radar.style.display = "";
    setStatus("locating", "定位中");
    geo.getCurrentPosition(onComplete, onError, { enableHighAccuracy: true });
  }
  function toggleTrack(){
    if(!geo) return;
    tracking = !tracking;
    trackBtn.style.color = tracking ? "#34d399" : "";
    trackBtn.style.borderColor = tracking ? "rgba(52,211,153,.5)" : "";
    if(tracking) geo.watchPosition(onComplete, onError, { enableHighAccuracy: true });
    else geo.clearWatch && geo.clearWatch();
  }

  function copyCoords(){
    var txt = lngEl.textContent + "," + latEl.textContent;
    if(!/^\d/.test(txt)) return;
    function done(){
      copyTxt.textContent = "已复制";
      copyBtn.classList.add("done");
      setTimeout(function(){ copyTxt.textContent = "复制"; copyBtn.classList.remove("done"); }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopy(txt, done); });
    } else fallbackCopy(txt, done);
  }
  function fallbackCopy(txt, done){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){}
    document.body.removeChild(ta);
  }

  /* ---------- 初始化：注入高德 JS API ---------- */
  function init(){
    var key = CONFIG.key.trim();
    if(!key || key.indexOf("在此填入") !== -1){
      radar.style.display = "none";
      showError("缺少高德 Key", "请在文件顶部的 CONFIG 中填入你的高德 JS-API Key（若为 2021-12-02 后申请的 key，还需填入安全密钥 securityJsCode）。");
      return;
    }
    if(CONFIG.securityJsCode && CONFIG.securityJsCode.trim()){
      window._AMapSecurityConfig = { securityJsCode: CONFIG.securityJsCode.trim() };
    }
    var s = document.createElement("script");
    s.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(key) + "&plugin=AMap.Geolocation";
    s.onload = function(){
      if(typeof AMap === "undefined"){ showError("高德地图加载失败", "请检查网络，或确认 key 有效。"); return; }
      map = new AMap.Map("map", { zoom: 15, resizeEnable: true, viewMode: "2D" });
      AMap.plugin("AMap.Geolocation", function(){
        geo = new AMap.Geolocation({
          enableHighAccuracy: true,
          timeout: 12000,
          zoomToAccuracy: true
        });
        locate();
      });
    };
    s.onerror = function(){ showError("高德地图加载失败", "无法加载高德 JS API，请检查网络连接后刷新。"); };
    document.head.appendChild(s);
  }

  locateBtn.addEventListener("click", locate);
  trackBtn.addEventListener("click", toggleTrack);
  copyBtn.addEventListener("click", copyCoords);
  init();
})();
</script>
</body>
</html>
