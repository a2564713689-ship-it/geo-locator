<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>坐标定位仪 · 高德 GPS 经纬度</title>
<style>
  :root{
    --bg:#0b0e13;
    --panel:#11161d;
    --panel-2:#0f141a;
    --line:rgba(255,255,255,.08);
    --line-2:rgba(255,255,255,.14);
    --txt:#e8edf2;
    --txt-dim:#8b98a8;
    --txt-faint:#5a6572;
    --acc:#a3e635;
    --acc-dim:rgba(163,230,53,.13);
    --acc-glow:rgba(163,230,53,.45);
    --warn:#fbbf24;
    --err:#f87171;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:
      linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/30px 30px,
      linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/30px 30px,
      radial-gradient(120% 80% at 50% -10%,#16202b 0%,var(--bg) 55%);
    color:var(--txt);
    font-family:var(--sans);
    min-height:100%;
    padding:18px 16px calc(24px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:430px;display:flex;flex-direction:column;gap:14px}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:12px;animation:rise .5s ease both}
  .logo{
    width:38px;height:38px;border-radius:10px;flex:none;
    background:linear-gradient(145deg,#1a242e,#10161d);
    border:1px solid var(--line-2);
    display:grid;place-items:center;
    box-shadow:0 0 0 4px rgba(255,255,255,.02),inset 0 1px 0 rgba(255,255,255,.06);
  }
  .logo svg{width:22px;height:22px}
  .title{flex:1;min-width:0}
  .title h1{font-size:16px;font-weight:600;letter-spacing:.02em}
  .title p{font-size:11px;color:var(--txt-faint);margin-top:2px;letter-spacing:.04em}
  .status{
    display:flex;align-items:center;gap:6px;
    font-size:11px;color:var(--txt-dim);
    border:1px solid var(--line);border-radius:999px;
    padding:5px 10px;background:var(--panel);white-space:nowrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--txt-faint);flex:none}
  .status.locating .dot{background:var(--warn);box-shadow:0 0 0 0 var(--warn);animation:pulse 1.1s ease-out infinite}
  .status.ok .dot{background:var(--acc);box-shadow:0 0 8px var(--acc-glow)}
  .status.err .dot{background:var(--err);box-shadow:0 0 8px rgba(248,113,113,.5)}

  /* ---------- coordinate card ---------- */
  .coord{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:16px;
    padding:18px 18px 16px;
    animation:rise .5s .06s ease both;
  }
  .coord::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(90deg,var(--acc-dim),transparent 30%),
      radial-gradient(90% 120% at 100% 0%,rgba(163,230,53,.05),transparent 50%);
  }
  .coord .grid-label{
    position:absolute;top:0;right:0;width:64px;height:64px;
    background-image:
      linear-gradient(rgba(163,230,53,.28) 1px,transparent 1px),
      linear-gradient(90deg,rgba(163,230,53,.28) 1px,transparent 1px);
    background-size:16px 16px;
    -webkit-mask-image:radial-gradient(60% 60% at 100% 0%,#000 20%,transparent 75%);
    mask-image:radial-gradient(60% 60% at 100% 0%,#000 20%,transparent 75%);
    opacity:.5;
  }
  .coord .top{display:flex;align-items:baseline;justify-content:space-between;position:relative}
  .coord .top .t{font-size:11px;letter-spacing:.18em;color:var(--txt-dim);text-transform:uppercase}
  .copy{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;color:var(--acc);
    background:transparent;border:1px solid var(--line-2);border-radius:8px;
    padding:5px 10px;cursor:pointer;font-family:var(--sans);
    transition:background .15s,transform .1s;
  }
  .copy:active{transform:scale(.94)}
  .copy.done{background:var(--acc-dim);border-color:rgba(163,230,53,.4)}
  .lnglat{display:flex;flex-direction:column;gap:8px;margin-top:16px;position:relative}
  .row{display:flex;align-items:baseline;gap:10px}
  .row .k{
    font-size:11px;color:var(--txt-faint);width:34px;flex:none;
    font-family:var(--mono);letter-spacing:.05em;
  }
  .row .v{
    font-family:var(--mono);font-size:26px;font-weight:600;
    letter-spacing:.03em;font-variant-numeric:tabular-nums;
    text-shadow:0 0 22px rgba(232,237,242,.12);
    transition:color .25s;
  }
  .row .v.updated{color:var(--acc)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative}
  .chip{
    font-size:11px;color:var(--txt-dim);
    border:1px solid var(--line);border-radius:7px;
    padding:4px 9px;background:rgba(255,255,255,.025);
    font-variant-numeric:tabular-nums;
  }
  .chip b{color:var(--txt);font-weight:600;font-family:var(--mono)}
  .chip.acc b{color:var(--acc)}

  /* ---------- map ---------- */
  .mapbox{
    position:relative;height:42vh;min-height:260px;
    border-radius:16px;overflow:hidden;border:1px solid var(--line);
    background:#0d1117;
    animation:rise .5s .12s ease both;
  }
  #map{width:100%;height:100%}
  .mapbox.loading::after{
    content:"";position:absolute;inset:0;z-index:2;
    background:rgba(10,13,18,.55);backdrop-filter:blur(2px);
    display:grid;place-items:center;
    background-image:radial-gradient(circle at center,transparent 8%,rgba(10,13,18,.75) 70%);
  }
  .radar{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
  .radar .ring{position:absolute;width:120px;height:120px;border-radius:50%;border:1px solid rgba(163,230,53,.55)}
  .radar .ring.r2{width:210px;height:210px;border-color:rgba(163,230,53,.28)}
  .radar .ring.r3{width:300px;height:300px;border-color:rgba(163,230,53,.13)}
  .radar .core{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 18px var(--acc-glow)}
  .radar .txt{
    position:absolute;bottom:26px;width:100%;text-align:center;
    font-size:12px;color:var(--txt-dim);letter-spacing:.08em;
  }
  .mapbox.loading .ring{animation:rings 1.6s ease-out infinite}
  .mapbox.loading .ring.r2{animation-delay:.3s}
  .mapbox.loading .ring.r3{animation-delay:.6s}
  .mapbox.error::before{
    content:"";position:absolute;inset:0;z-index:2;background:rgba(10,13,18,.72);
    display:grid;place-items:center;
  }
  .maperr{
    position:absolute;inset:0;z-index:4;display:none;
    place-items:center;text-align:center;padding:24px;
  }
  .maperr.show{display:grid}
  .maperr .icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;margin:0 auto 10px;color:var(--warn)}
  .maperr h3{font-size:14px;font-weight:600;margin-bottom:6px}
  .maperr p{font-size:12px;color:var(--txt-dim);line-height:1.7}

  /* ---------- actions ---------- */
  .actions{display:flex;gap:10px;animation:rise .5s .18s ease both}
  .btn{
    flex:1;border:none;border-radius:12px;cursor:pointer;
    font-size:15px;font-weight:600;font-family:var(--sans);
    padding:14px 0;letter-spacing:.06em;
    transition:transform .1s,box-shadow .2s,opacity .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{
    background:linear-gradient(180deg,#b4f04d,#93d92b);
    color:#10150a;
    box-shadow:0 6px 22px rgba(163,230,53,.25),inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn.primary:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{
    flex:none;width:52px;
    background:var(--panel);border:1px solid var(--line-2);color:var(--txt);
    display:grid;place-items:center;
  }
  .btn.ghost svg{width:19px;height:19px}

  /* ---------- footer ---------- */
  .note{
    text-align:center;font-size:11px;color:var(--txt-faint);line-height:1.8;
    animation:rise .5s .24s ease both;
  }
  .note code{
    font-family:var(--mono);font-size:10px;color:var(--txt-dim);
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:5px;padding:1px 6px;
  }

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--warn)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @keyframes rings{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.15);opacity:0}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#a3e635" stroke-width="1.6">
        <circle cx="12" cy="12" r="7.2"/>
        <circle cx="12" cy="12" r="1.6" fill="#a3e635" stroke="none"/>
        <path d="M12 2v3.2M12 18.8V22M2 12h3.2M18.8 12H22" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="title">
      <h1>坐标定位仪</h1>
      <p>AMap GPS · GCJ-02 · 手机定位</p>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusTxt">待定位</span></div>
  </header>

  <section class="coord">
    <div class="grid-label"></div>
    <div class="top">
      <span class="t">当前位置坐标</span>
      <button class="copy" id="copyBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>
        </svg>
        <span id="copyTxt">复制</span>
      </button>
    </div>
    <div class="lnglat">
      <div class="row"><span class="k">LNG</span><span class="v" id="lng">--.------</span></div>
      <div class="row"><span class="k">LAT</span><span class="v" id="lat">--.------</span></div>
    </div>
    <div class="chips">
      <span class="chip acc">精度 <b id="acc">--</b></span>
      <span class="chip">来源 <b id="src">--</b></span>
      <span class="chip">更新 <b id="time">--:--:--</b></span>
      <span class="chip">坐标 <b>GCJ-02</b></span>
    </div>
  </section>

  <section class="mapbox loading" id="mapbox">
    <div id="map"></div>
    <div class="radar" id="radar">
      <span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span>
      <span class="core"></span>
      <span class="txt">正在获取卫星信号…</span>
    </div>
    <div class="maperr" id="maperr">
      <div>
        <div class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>
          </svg>
        </div>
        <h3 id="errTitle">定位失败</h3>
        <p id="errMsg"></p>
      </div>
    </div>
  </section>

  <div class="actions">
    <button class="btn primary" id="locateBtn">重新定位</button>
    <button class="btn ghost" id="trackBtn" title="持续追踪">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="note">
    需要 HTTPS 与定位权限，高德 JS API 定位输出 GCJ-02 坐标。<br>
    定位方式：浏览器 GPS / 基站 / WiFi；IP 定位精度仅为城市级。
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ================= 配置区 ================= */
  var CONFIG = {
    key: "d8ea30e0dee999f5cae1ef984d0e0c8b",
    securityJsCode: "ecdb3d40bb86f25a2fb072f4e91a3031"
  };
  /* ========================================== */

  var $ = function(id){ return document.getElementById(id); };
  var statusEl = $("status"), statusTxt = $("statusTxt");
  var lngEl = $("lng"), latEl = $("lat"), accEl = $("acc"), srcEl = $("src"), timeEl = $("time");
  var mapbox = $("mapbox"), radar = $("radar"), maperr = $("maperr");
  var errTitle = $("errTitle"), errMsg = $("errMsg");
  var locateBtn = $("locateBtn"), trackBtn = $("trackBtn");
  var copyBtn = $("copyBtn"), copyTxt = $("copyTxt");

  var map = null, marker = null, accCircle = null, tracking = false, geo = null;

  function setStatus(mode, txt){
    statusEl.className = "status" + (mode ? " " + mode : "");
    statusTxt.textContent = txt;
  }
  function setCoord(lng, lat){
    lngEl.textContent = lng.toFixed(6);
    latEl.textContent = lat.toFixed(6);
    [lngEl, latEl].forEach(function(el){
      el.classList.remove("updated");
      void el.offsetWidth; // 触发重绘以重放动画
      el.classList.add("updated");
    });
  }
  function setTime(){
    var d = new Date();
    var p = function(n){ return (n < 10 ? "0" : "") + n; };
    timeEl.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function srcName(type){
    switch (type) {
      case "html5": return "浏览器定位";
      case "ip": return "IP 定位";
      case "sdk": return "SDK 定位";
      case 1: return "GPS 卫星";
      case 2: return "基站";
      case 4: return "混合定位";
      default: return type || "--";
    }
  }

  function showError(title, msg){
    setStatus("err", "定位失败");
    errTitle.textContent = title || "定位失败";
    errMsg.textContent = msg || "";
    maperr.classList.add("show");
    mapbox.classList.remove("loading");
    locateBtn.disabled = false;
  }

  function drawOnMap(lng, lat, accuracy){
    if(!map) return;
    if(accCircle) map.remove(accCircle);
    if(marker) map.remove(marker);
    marker = new AMap.Marker({ position: [lng, lat] });
    map.add(marker);
    if(accuracy && accuracy > 0){
      accCircle = new AMap.Circle({
        center: [lng, lat], radius: accuracy,
        strokeColor: "#a3e635", strokeWeight: 1, strokeOpacity: .6,
        fillColor: "#a3e635", fillOpacity: .07
      });
      map.add(accCircle);
      map.setFitView([marker, accCircle], false, [40,40,40,40]);
    } else {
      map.setCenter([lng, lat]);
      map.setZoom(16);
    }
  }

  function onComplete(data){
    radar.style.display = "none";
    mapbox.classList.remove("loading");
    maperr.classList.remove("show");
    locateBtn.disabled = false;
    if(!data || !data.position){
      showError("定位失败", "未返回有效位置，请重试");
      return;
    }
    var pos = data.position; // LngLat 对象或 [lng, lat]
    var lng = pos.lng !== undefined ? pos.lng : pos[0];
    var lat = pos.lat !== undefined ? pos.lat : pos[1];
    var acc = data.accuracy;
    setCoord(lng, lat);
    accEl.textContent = acc ? acc + " m" : "--";
    srcEl.textContent = srcName(data.location_type || data.locationType);
    setTime();
    setStatus("ok", "已定位");
    drawOnMap(lng, lat, acc);
  }
  function onError(err){
    radar.style.display = "none";
    mapbox.classList.remove("loading");
    maperr.classList.remove("show");
    locateBtn.disabled = false;
    var msg = (err && err.message) ? err.message : "未知错误";
    if(/permission|denied|拒绝/i.test(msg)) msg = "定位权限被拒绝：请在浏览器设置中开启定位权限，并确保页面通过 HTTPS 访问。";
    else if(/timeout|超时/i.test(msg)) msg = "定位超时：请移动到开阔地带（远离高楼/隧道）后重试。";
    showError("定位失败", msg);
  }

  function locate(){
    if(!geo){ locateBtn.disabled = false; return; }
    locateBtn.disabled = true;
    maperr.classList.remove("show");
    mapbox.classList.add("loading");
    radar.style.display = "";
    setStatus("locating", "定位中");
    geo.getCurrentPosition(onComplete, onError, { enableHighAccuracy: true });
  }
  function toggleTrack(){
    if(!geo) return;
    tracking = !tracking;
    trackBtn.style.color = tracking ? "#a3e635" : "";
    trackBtn.style.borderColor = tracking ? "rgba(163,230,53,.5)" : "";
    if(tracking) geo.watchPosition(onComplete, onError, { enableHighAccuracy: true });
    else geo.clearWatch && geo.clearWatch();
  }

  function copyCoords(){
    var txt = lngEl.textContent + "," + latEl.textContent;
    if(!/^\d/.test(txt)) return;
    function done(){
      copyTxt.textContent = "已复制";
      copyBtn.classList.add("done");
      setTimeout(function(){ copyTxt.textContent = "复制"; copyBtn.classList.remove("done"); }, 1600);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){ fallbackCopy(txt, done); });
    } else fallbackCopy(txt, done);
  }
  function fallbackCopy(txt, done){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){}
    document.body.removeChild(ta);
  }

  /* ---------- 初始化：注入高德 JS API ---------- */
  function init(){
    var key = CONFIG.key.trim();
    if(!key || key.indexOf("在此填入") !== -1){
      radar.style.display = "none";
      showError("缺少高德 Key", "请在文件顶部的 CONFIG 中填入你的高德 JS-API Key（若为 2021-12-02 后申请的 key，还需填入安全密钥 securityJsCode）。");
      return;
    }
    if(CONFIG.securityJsCode && CONFIG.securityJsCode.trim()){
      window._AMapSecurityConfig = { securityJsCode: CONFIG.securityJsCode.trim() };
    }
    var s = document.createElement("script");
    s.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(key) + "&plugin=AMap.Geolocation";
    s.onload = function(){
      if(typeof AMap === "undefined"){ showError("高德地图加载失败", "请检查网络，或确认 key 有效。"); return; }
      map = new AMap.Map("map", { zoom: 15, resizeEnable: true, viewMode: "2D" });
      AMap.plugin("AMap.Geolocation", function(){
        geo = new AMap.Geolocation({
          enableHighAccuracy: true,
          timeout: 12000,
          zoomToAccuracy: true
        });
        locate();
      });
    };
    s.onerror = function(){ showError("高德地图加载失败", "无法加载高德 JS API，请检查网络连接后刷新。"); };
    document.head.appendChild(s);
  }

  locateBtn.addEventListener("click", locate);
  trackBtn.addEventListener("click", toggleTrack);
  copyBtn.addEventListener("click", copyCoords);
  init();
})();
</script>
</body>
</html>
